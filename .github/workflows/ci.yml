# Static analysis and tests, exercised across every Python version the
# package claims to support (`requires-python = ">=3.10,<4"` in pyproject.toml).
# Keep the matrix in sync with that range when the floor or ceiling moves.

name: CI

on:
    push:
        branches: [master, develop]
    pull_request:
    # Allow running the full matrix on any branch from the Actions tab.
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    qa:
        name: Python ${{ matrix.python-version }}
        runs-on: ubuntu-latest
        strategy:
            # Report every supported version, even if one fails.
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v10.2.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: uv sync --locked

            - name: Ruff (lint)
              # GitHub output format produces inline PR annotations.
              run: uv run ruff check --output-format=github .

            - name: Ruff (format)
              run: uv run ruff format --check .

            - name: Mypy
              run: uv run mypy .

            - name: Tests
              run: uv run pytest
