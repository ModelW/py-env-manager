name: Release Python package

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup uv
              uses: astral-sh/setup-uv@v9.0.0

            - name: Build package
              run: uv build

            - name: Publish package
              uses: pypa/gh-action-pypi-publish@release/v1
